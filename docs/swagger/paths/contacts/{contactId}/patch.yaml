tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Update an existing contact by ID'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: The contact ID
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Contact's name"
            example: 'Jane Doe'
          email:
            type: string
            description: "Contact's email"
            example: 'jane.doe@example.com'
          phone:
            type: string
            description: "Contact's phone number"
            example: '+380501234567'
          favorite:
            type: boolean
            description: 'Mark contact as favorite'
            example: true
          photo:
            type: string
            format: binary
            description: "Contact's photo"
responses:
  '200':
    description: Successfully updated a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated a contact!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
