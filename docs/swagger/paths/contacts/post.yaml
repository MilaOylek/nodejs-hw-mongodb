tags:
  - Contacts
summary: Create new contact
operationId: createContact
description: Add new contact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
          - phone
        properties:
          name:
            type: string
            description: "Contact's name"
            example: 'John Doe'
          email:
            type: string
            description: "Contact's email"
            example: 'john.doe@example.com'
          phone:
            type: string
            description: "Contact's phone"
            example: '+380991234567'
          photo:
            type: string
            format: binary
            description: "Contact's photo"
responses:
  '201':
    description: Created contact successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
